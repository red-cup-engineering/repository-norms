name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - run: npm test
      - name: This repository's landing links resolve
        run: node bin/repository-norms.mjs frontdoor . --json
      - name: This repository meets its own norms
        run: node bin/repository-norms.mjs check .
